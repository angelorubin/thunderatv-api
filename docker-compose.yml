services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: thundera-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thundera
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thundera"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
